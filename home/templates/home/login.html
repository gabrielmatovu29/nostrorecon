{% extends "home/base.html" %}

{% block title %}Login - Nostro Reconciliation{% endblock %}

{% block content %}
<div style="max-width: 400px; margin: 40px auto; padding: 20px; border: 1px solid #ccc; border-radius: 8px;">
    <h2>Sign In</h2>
    
    {% if form.errors %}
        <p style="color: red;">Invalid username or password.</p>
    {% endif %}

    <form method="post" action="{% url 'login' %}">
        {% csrf_token %}
        <div style="margin-bottom: 15px;">
            <label for="id_username">Username:</label><br>
            <input type="text" name="username" id="id_username" required style="width: 100%; padding: 8px;">
        </div>
        
        <div style="margin-bottom: 15px;">
            <label for="id_password">Password:</label><br>
            <input type="password" name="password" id="id_password" required style="width: 100%; padding: 8px;">
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%;">Log In</button>
    </form>
</div>
{% endblock %}
