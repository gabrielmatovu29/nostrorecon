<!DOCTYPE html>
<html>
<head>
    <title>{% block title %}Nostro Recon System{% endblock %}</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }
        .sidebar {
            width: 200px;
            background-color: #2c3e50;
            color: white;
            height: 100vh;
            padding-top: 20px;
            position: fixed;   /* ✅ lock sidebar */
            top: 0;
            left: 0;
            overflow-y: auto;  /* scroll only inside sidebar if needed */
        }
        .sidebar h2 {
            margin-left: 10px;
        }
        .sidebar a {
            display: block;
            color: white;
            padding: 10px;
            text-decoration: none;
        }
        .sidebar a:hover {
            background-color: #34495e;
        }
        .content {
            margin-left: 200px;  /* ✅ prevent overlap */
            padding: 20px;
        }
        .scroll-table {
            max-height: 400px;   /* ✅ show ~20 rows */
            overflow-y: scroll;
            border: 1px solid #ccc;
            margin-bottom: 20px;
        }
        .scroll-table table {
            width: 100%;
            border-collapse: collapse;
        }
        .scroll-table th, .scroll-table td {
            border: 1px solid #ddd;
            padding: 8px;
        }
        .btn {
            display: inline-block;
            margin-top: 10px;
            padding: 8px 12px;
            background-color: #3498db;
            color: white;
            text-decoration: none;
            border-radius: 4px;
        }
        .btn:hover {
            background-color: #2980b9;
        }
    </style>
</head>
<body>
    <div class="sidebar">
        <h2>Navigator</h2>
        <a href="{% url 'home' %}">Home</a>
        <a href="{% url 'ledgers' %}">Ledgers</a>
        <a href="{% url 'nostros' %}">Nostros</a>
        <a href="{% url 'matching' %}">Matching</a>
    </div>

    <div class="content">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
